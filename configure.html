<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình TPB Addon</title>
    <!-- NHÚNG FILE TĨNH THẨM MỸ CSS RIÊNG BIỆT TỪ SERVER -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="box">
        <h2>🏴‍☠️ TPB TorBox Config</h2>
        <p style="color:#aaa; font-size:14px;">Tối ưu hóa luồng xem phim không giật lag</p>
        <hr style="border-color: #333; margin-bottom: 20px;">
        
        <label>Chọn thể loại mặc định:</label>
        <select id="genre" onchange="updateQRCode()">
            <option value="All">All</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Sci-Fi">Sci-Fi</option>
        </select>

        <label>TorBox API Key:</label>
        <div class="password-wrapper">
            <input type="password" id="token" placeholder="Dán mã TorBox API Key của bạn..." oninput="updateQRCode()" />
            <button type="button" class="toggle-btn" id="togglePassword" onclick="toggleTokenVisibility()">
                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>

        <div class="checkbox-container" onclick="document.getElementById('adult_content').click();">
            <input type="checkbox" id="adult_content" onclick="event.stopPropagation(); updateQRCode();">
            <span style="font-weight: bold; color: #ff3333;">Kích hoạt nội dung Người lớn (Adult 18+)</span>
        </div>

        <div class="btn-group">
            <button class="submit-btn" onclick="installAddon()">CÀI ĐẶT VÀO STREMIO</button>
            <button class="copy-btn" id="copyBtn" onclick="copyManifestLink()">SAO CHÉP LINK MANIFEST</button>
        </div>

        <div class="qr-section">
            <div class="qr-title">📱 Quét mã QR để cài đặt nhanh trên điện thoại / TV</div>
            <div id="qrcode"></div>
        </div>
    </div>
    <!-- 🌟 THAY ĐỔI CHIẾC LƯỢC: Nhúng file qrcode nội bộ sạch chống sập mạng -->
    <script src="/qrcode.js"></script>
    <!-- 🌟 NHÚNG FILE LOGIC XỬ LÝ JAVASCRIPT RIÊNG BIỆT TỪ SERVER -->
    <script src="/script.js"></script>
</body>
</html>
