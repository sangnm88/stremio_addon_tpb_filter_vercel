<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình TPB Addon</title>
    <!-- NHÚNG FILE TĨNH THẨM MỸ CSS RIÊNG BIỆT TỪ SERVER -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="box">
        <h2>🏴‍☠️ TPB TorBox Config</h2>
        <p style="color:#aaa; font-size:14px;">Tối ưu hóa luồng xem phim không giật lag</p>
        <hr style="border-color: #333; margin-bottom: 20px;">
        
        <label>Chọn thể loại mặc định:</label>
        <select id="genre" onchange="updateQRCode()">
            <option value="All">All</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Sci-Fi">Sci-Fi</option>
        </select>

        <!-- 1. Checkbox tổng điều hướng: Cho phép bật/tắt tính năng cá nhân hóa thể loại -->
        <div class="config-group" style="margin-top: 15px; text-align: left;">
            <label style="color: #00ffff; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="enable_customize_genres" style="transform: scale(1.2); cursor: pointer;"> 
                🛠️ Kích hoạt tùy chỉnh Thể loại nâng cao
            </label>
        </div>

        <!-- 2. Khối thẻ DIV chứa bộ chọn thể loại động (Mặc định ẩn hoàn toàn bằng display: none) -->
        <div id="customize_genres_panel" style="display: none; margin-top: 15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #111; text-align: left;">
            <label style="font-weight: bold; display: block; margin-bottom: 10px; color: #fff; font-size: 14px;">
                🎭 Tích chọn các Thể loại hiển thị ngoài Tivi:
            </label>
            
            <div class="genres-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="Missax" checked disabled> Missax
                </label>
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="Teamskeet" checked> Teamskeet
                </label>
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="WowGirls" checked> WowGirls
                </label>
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="SweetHeart" checked> SweetHeart
                </label>
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="FC2" checked> FC2
                </label>
                <label style="color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" class="genre-checkbox" value="Uncen" checked> Uncen
                </label>
            </div>

            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #fff; font-size: 13px;">
                ➕ Gõ thêm thể loại tự chế (Ví dụ: Anime, Drama, Korean...):
            </label>
            <input type="text" id="custom_genres" placeholder="Cách nhau bằng dấu phẩy (,)" 
                   style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box;">
        </div>


        <label>TorBox API Key:</label>
        <div class="password-wrapper">
            <input type="password" id="token" placeholder="Dán mã TorBox API Key của bạn..." oninput="updateQRCode()" />
            <button type="button" class="toggle-btn" id="togglePassword" onclick="toggleTokenVisibility()">
                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>

        <div class="checkbox-container" onclick="document.getElementById('adult_content').click();">
            <input type="checkbox" id="adult_content" onclick="event.stopPropagation(); updateQRCode();">
            <span style="font-weight: bold; color: #ff3333;">Kích hoạt nội dung Người lớn (Adult 18+)</span>
        </div>

        <div class="btn-group">
            <button class="submit-btn" onclick="installAddon()">CÀI ĐẶT VÀO STREMIO</button>
            <button class="copy-btn" id="copyBtn" onclick="copyManifestLink()">SAO CHÉP LINK MANIFEST</button>
        </div>

        <div class="qr-section">
            <div class="qr-title">📱 Quét mã QR để cài đặt nhanh trên điện thoại / TV</div>
            <div id="qrcode"></div>
        </div>
    </div>
    <!-- 🌟 THAY ĐỔI CHIẾC LƯỢC: Nhúng file qrcode nội bộ sạch chống sập mạng -->
    <script src="/qrcode.js"></script>
    <!-- 🌟 NHÚNG FILE LOGIC XỬ LÝ JAVASCRIPT RIÊNG BIỆT TỪ SERVER -->
    <script src="/script.js"></script>
</body>
</html>
